<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABHHS 38th Reunion</title>

<style>
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin:0;
  background:#f3f5f9;
  color:#1f2937;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#ffffff;
  border-radius:18px;
  padding:26px;
  box-shadow:0 12px 30px rgba(0,0,0,0.08);
}

/* Header */
h1{
  text-align:center;
  color:#0a3d62;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#0a3d62;
  color:#fff;
  padding:8px 18px;
  border-radius:30px;
  font-weight:600;
  margin-bottom:10px;
}

/* Counter */
.counter{
  text-align:center;
  margin:10px 0 20px;
  font-weight:700;
  color:#0a3d62;
}

/* Form base */
label{
  font-weight:600;
  margin-bottom:6px;
  display:block;
}

input, textarea{
  width:100%;
  padding:12px 14px;
  font-size:15px;
  border-radius:10px;
  border:1.5px solid #cbd5e1;
  margin-bottom:18px;
  box-sizing:border-box;
}

/* Pay button */
.pay-btn{
  width:100%;
  padding:18px;
  font-size:18px;
  font-weight:700;
  background:#0a3d62;
  color:#fff;
  border:none;
  border-radius:18px;
  cursor:pointer;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal-content{
  background:#fff;
  width:92%;
  max-width:420px;
  padding:26px;
  border-radius:18px;
  text-align:center;
}

/* Loader */
.loader{
  display:none;
  text-align:center;
  padding:40px;
}

.spinner{
  width:42px;
  height:42px;
  border:5px solid #ddd;
  border-top-color:#0a3d62;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* Thank You */
.thank-you{
  display:none;
  text-align:center;
  padding:40px;
}

.thank-you h2{
  color:#0a3d62;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div style="text-align:center">
  <span class="badge">🎉 ৩৮ বর্ষপূর্তি পুনর্মিলনী</span>
</div>

<h1>Aricha Belayet Hossain High School</h1>

<div class="counter">
  এখন পর্যন্ত <span id="regCount">0</span> জন রেজিস্ট্রেশন করেছেন
</div>

<form id="registrationForm">

<label>১৫. পাসপোর্ট সাইজ ছবি *</label>
<input type="file" required>

<button class="pay-btn" type="submit">
  পে করুন ৳ <span id="payAmount">0</span>
</button>

<div id="transactionSection" style="display:none;">
  <label>১৬. Transaction ID / Sender Number *</label>
  <input type="text" id="transactionInput">
</div>

</form>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>আপনার তথ্য ও ফাইল জমা হচ্ছে…</p>
</div>

<!-- Thank You -->
<div class="thank-you" id="thankYou">
  <h2>🎉 ধন্যবাদ!</h2>
  <p>আপনার রেজিস্ট্রেশন সফলভাবে সম্পন্ন হয়েছে।</p>
  <p><b>আপনার রেজিস্ট্রেশন নম্বর:</b></p>
  <h3>#<span id="regNumber"></span></h3>
</div>

</div>
</div>

<script>
/* Registration Counter */
let count = localStorage.getItem('regCount');
if(!count){ count = 0; }
document.getElementById('regCount').textContent = count;

/* Final Submit */
const form = document.getElementById('registrationForm');
const loader = document.getElementById('loader');
const thankYou = document.getElementById('thankYou');

form.addEventListener('submit', function(e){
  e.preventDefault();

  const txn = document.getElementById('transactionInput');
  if(txn.style.display !== 'none' && txn.value.trim()===''){
    alert('Transaction ID দিন');
    return;
  }

  form.style.display='none';
  loader.style.display='block';

  setTimeout(()=>{
    loader.style.display='none';
    thankYou.style.display='block';

    let newCount = parseInt(count) + 1;
    localStorage.setItem('regCount', newCount);
    document.getElementById('regCount').textContent = newCount;

    document.getElementById('regNumber').textContent = newCount;
  }, 2000);
});
</script>

</body>
</html>
